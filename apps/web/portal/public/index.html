<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keir</title><link rel="stylesheet" href="/portal.css"><script src="/portal.js" defer></script></head><body>
<section id="login"><div class="wordmark">Lakeside <span>/ Keir</span></div><h1>Your operator.<br>Your stack.</h1><p>Sign in to your independent Keir installation.</p><a id="sso" href="/auth/game?next=/keir/app" hidden>Sign in with your studio account</a><form id="signin"><label id="email-label" hidden>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<div id="workspace" hidden><aside><div class="wordmark">Keir <span>by Lakeside</span></div><button id="new-thread">New conversation</button><nav id="threads" aria-label="Conversations"></nav><div class="aside-footer"><span id="identity"></span><button id="logout">Sign out</button></div></aside><main><header><div><small>YOUR WORKSPACE</small><h1 id="title">Keir</h1></div><span class="connection" id="connection">Connected</span></header><section id="messages" aria-label="Conversation" aria-live="polite"></section><section id="tasks" aria-label="Active tasks"></section><form id="compose"><label class="sr-only" for="message">Message Keir</label><textarea id="message" placeholder="Ask Keir to look into something…" rows="2" maxlength="6000" required></textarea><div><small>Work is limited to your configured project and permissions.</small><button>Send</button></div></form></main></div><p id="error" role="alert" hidden></p></body></html>
