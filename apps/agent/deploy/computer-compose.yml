# OpenMuse's persistent browser worker, isolated from operator credentials.
services:
  browser:
    build: ../vendor/openmuse-browser
    ports: ["127.0.0.1:9770:8790"]
    env_file: /etc/keir-computer.env
    volumes: ["browser-profiles:/data"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    pids_limit: 256
    cpus: 1
    restart: unless-stopped
volumes:
  browser-profiles:
