name: TestFlight availability

on:
  workflow_dispatch:
    inputs:
      build:
        description: Uploaded build number to inspect (read only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read Apple processing and beta state
        env:
          BUILD_NUMBER: ${{ inputs.build }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: python3 scripts/testflight-status.py "$BUILD_NUMBER"
