name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/cli ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --test apps/desktop/policy.test.js
      - name: Check JavaScript entry points
        run: |
          node --check apps/web/src/index.js
          node --check apps/web/portal/public/portal.js
          node --check apps/desktop/main.js
          node --check bin/lakeside.js
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/agent/package-lock.json
      - name: Install the network-isolation test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build pkg-config libcap-dev
          curl -fsSL https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz -o "$RUNNER_TEMP/bubblewrap.tar.xz"
          echo "c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71  $RUNNER_TEMP/bubblewrap.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bwrap-build" "$RUNNER_TEMP/bubblewrap-0.11.1" -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bwrap-build"
          sudo install -m 0755 "$RUNNER_TEMP/bwrap-build/bwrap" /usr/bin/bwrap
          /usr/bin/bwrap --version
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Every tracked test file, about 700 tests in 20 seconds. Running only a named
      # subset let the rest of the suite rot unnoticed.
      - name: Full tracked test suite
        run: npm test
      - name: UI safety ratchet
        run: node scripts/check-innerhtml.js
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/rust
      - run: cargo test --locked --manifest-path apps/agent/rust/Cargo.toml
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned secret scanner
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks git --log-opts=--all --redact --config .gitleaks.toml
