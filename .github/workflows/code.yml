name: Lakeside Code
on:
  pull_request:
    paths: [apps/agent/skills/**, apps/cli/**, bin/lakeside.js, .github/workflows/code.yml]
  push:
    branches: [main]
    paths: [apps/agent/skills/**, apps/cli/**, bin/lakeside.js, .github/workflows/code.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cli/package-lock.json
      - run: npm --prefix apps/cli ci --no-audit --no-fund
      - run: npm run test:cli
      - name: Pack and install independently of the checkout
        working-directory: apps/cli
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/code-install" "$RUNNER_TEMP/lakesidegamedev-code-0.1.0.tgz" --no-audit --no-fund
          "$RUNNER_TEMP/code-install/node_modules/.bin/lakeside" code --version
          "$RUNNER_TEMP/code-install/node_modules/.bin/lakeside" code doctor
      - name: Check installed engine and coordination tools
        run: node apps/cli/smoke.mjs
        env:
          LAKESIDE_CODE_PACKAGE_ROOT: ${{ runner.temp }}/code-install/node_modules/@lakesidegamedev/code
      - name: Check installed terminal in a real PTY
        run: python3 apps/cli/tui-smoke.py
        env:
          LAKESIDE_CODE_PACKAGE_ROOT: ${{ runner.temp }}/code-install/node_modules/@lakesidegamedev/code
      - name: Bundle Windows prototype installers
        run: python3 apps/cli/package-windows.py --package "$RUNNER_TEMP/lakesidegamedev-code-0.1.0.tgz" --output "$RUNNER_TEMP/Lakeside-Code-Windows-Prototype.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lakeside-code
          path: |
            ${{ runner.temp }}/lakesidegamedev-code-0.1.0.tgz
            ${{ runner.temp }}/Lakeside-Code-Windows-Prototype.zip
          if-no-files-found: error
  windows:
    needs: cli
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      NPM_CONFIG_PREFIX: ${{ runner.temp }}/Lakeside Global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: lakeside-code
          path: ${{ runner.temp }}/code-artifact
      - name: Install the Windows ZIP with Windows PowerShell
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'code-artifact/Lakeside-Code-Windows-Prototype.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Lakeside Prototype'
          Expand-Archive -LiteralPath $bundle -DestinationPath $destination
          & (Join-Path $destination 'Install-LakesideCode.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows installation failed' }
          & (Join-Path $env:NPM_CONFIG_PREFIX 'lakeside.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed command failed' }
      - name: Check native engine, Keir skills and coordination tools
        shell: powershell
        run: |
          $env:LAKESIDE_CODE_PACKAGE_ROOT = Join-Path $env:NPM_CONFIG_PREFIX 'node_modules/@lakesidegamedev/code'
          node apps/cli/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows runtime check failed' }
