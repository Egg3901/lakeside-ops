name: LakesideOps
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.29.0
  LakesideCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
targets:
  LakesideOps:
    type: application
    platform: iOS
    sources: [Shared, Ops]
    dependencies:
      - package: LakesideCore
      - package: SwiftDraw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops
        MARKETING_VERSION: '2.0.0'
        INFOPLIST_KEY_CFBundleDisplayName: Lakeside Ops
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": scripts/simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": scripts/ops.entitlements
  OpsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.uitests
        TEST_TARGET_NAME: LakesideOps
  OpsSessionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SessionTests]
    dependencies:
      - target: LakesideOps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.lakesidegames.ops.sessiontests
schemes:
  LakesideOps:
    build:
      targets:
        LakesideOps: all
    test:
      targets: [OpsUITests, OpsSessionTests]
